[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-crashtest"
version = "0.0.1"
description = "Crash-consistency testbench for AI-agent tool calls"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
# Experiment 006 (M5) calls the Anthropic API. Not needed for anything else.
m5 = ["anthropic"]
# pytest, plus a pip-installable PostgreSQL for running without Docker.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pgserver>=0.1.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["crashtest"]
branch = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crashtest = ["sink/schema.sql", "results/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
