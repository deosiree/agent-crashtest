name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: mypy
        run: mypy

  test-local:
    # Tests start their own stack: pip-installed PostgreSQL plus the services as subprocesses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  test-docker:
    # Same tests against the Docker Compose stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start stack
        run: docker compose up --build -d --wait
      - name: Tests against the stack
        env:
          CRASHTEST_SINK_URL: http://localhost:8101
          CRASHTEST_MCP_URL: http://localhost:8102/mcp
          CRASHTEST_MCP_URL_STATELESS_SSE: http://localhost:8103/mcp
          CRASHTEST_MCP_URL_STATEFUL_JSON: http://localhost:8104/mcp
          CRASHTEST_MCP_URL_STATEFUL_SSE: http://localhost:8105/mcp
          CRASHTEST_MCP_URL_STATEFUL_SSE_STORE: http://localhost:8106/mcp
        run: pytest
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
