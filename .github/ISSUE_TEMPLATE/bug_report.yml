name: Bug report
description: crashtest itself misbehaves (a crash, a wrong count, a setup that fails)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        For "my agent failed and I don't know why", use the "My agent failed" template
        instead. Please do not paste secrets, API keys or customer data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and its full output (the text or JSON report, or the error).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of: pip show agent-crashtest"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12.2
    validations:
      required: true
